# Fail2Ban filter for BetterShield's host-ban line (Fail2Ban 0.10.5 or later,
# for <SUBNET>). Copy to /etc/fail2ban/filter.d/bettershield.conf.
#
# BetterShield writes one line to the auth log when it pauses a connection,
# once "Tell this server's firewall when a connection is paused" is on under
# BetterShield > Login & access, or a host turns it on for every site with:
#   add_filter( 'bettershield_host_ban_line', '__return_true' );
#
#   bettershield[4242]: lockout surface=signin network=203.0.113.0/24 minutes=15 site=example.com
#
# The line carries a network (IPv4 /24, IPv6 /64), never an address or a
# username, so <SUBNET> bans the whole network.

[INCLUDES]
before = common.conf

[Definition]
_daemon   = bettershield
failregex = ^%(__prefix_line)slockout surface=\S+ network=<SUBNET> minutes=\d+ site=\S+\s*$
ignoreregex =

# One site only on a shared auth log: replace \S+ after site= with its
# address, for example site=example\.com(?:/\S*)?
